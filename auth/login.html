<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — N. Bernard Portfolio</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../assets/css/chatbot.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 60px;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
    }
    .auth-card h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-card .subtitle {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-form input {
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-form input:focus {
      border-color: var(--accent);
    }
    .auth-form .btn {
      width: 100%;
      text-align: center;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .auth-form .btn-primary {
      padding: 14px 28px;
    }
    .auth-links {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .auth-links a {
      color: var(--accent-2);
      text-decoration: none;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }
    .role-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }
    .role-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .role-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(124, 92, 255, 0.1);
    }
    .error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      display: none;
    }
    .success-msg {
      color: #51cf66;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="twinkling" aria-hidden="true"></div>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo">
        <span class="flag-badge" aria-hidden="true"><span class="sun"></span></span>
        <span class="logo-name">N. Bernard</span><span class="logo-dot">.</span>
      </a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation" />
      <label for="nav-toggle" class="nav-hamburger" aria-hidden="true">
        <span></span><span></span><span></span>
      </label>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../index.html#projects">Projects</a></li>
        <li><a href="../index.html#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>

      <div class="role-selector" style="display: none;">
        <button class="role-btn active" data-role="user" onclick="selectRole('user')">User</button>
        <button class="role-btn" data-role="admin" onclick="selectRole('admin')">Admin</button>
      </div>

      <form class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email address" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <p class="error-msg" id="loginError"></p>
        <p class="success-msg" id="loginSuccess"></p>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="auth-divider">or</div>

      <div class="auth-links">
        <p>Don't have an account? <a href="register.html">Sign up</a></p>
        <p><a href="../index.html">← Back to Portfolio</a></p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 N. Bernard. Built with HTML & CSS 🚀</p>
  </footer>

  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    let selectedRole = 'user';

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      const successEl = document.getElementById('loginSuccess');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      // Demo authentication (localStorage-based)
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        localStorage.setItem('currentUser', JSON.stringify(user));
        successEl.textContent = 'Login successful! Redirecting...';
        successEl.style.display = 'block';
        setTimeout(() => {
          if (user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = '../index.html';
          }
        }, 1500);
      } else {
        errorEl.textContent = 'Invalid email or password. Please try again.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
